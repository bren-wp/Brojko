// Plugin resolution is separate from app Lint configurations. Upgrade only
// the exact vulnerable requests observed in buildEnvironment, before plugins resolve.
buildscript {
    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            def upgrades = [
                'org.bouncycastle:bcprov-jdk18on:1.80.2':'1.85',
                'org.bouncycastle:bcpkix-jdk18on:1.80.2':'1.85',
                'org.bouncycastle:bcutil-jdk18on:1.80.2':'1.85',
                'com.google.guava:guava:33.3.1-jre':'33.7.2-jre',
                'com.google.guava:guava:33.4.0-jre':'33.7.2-jre',
                'com.google.guava:guava:33.7.1-jre':'33.7.2-jre',
                'org.apache.httpcomponents:httpclient:4.5.6':'4.5.14',
                'org.apache.httpcomponents:httpmime:4.5.6':'4.5.14',
                'org.apache.commons:commons-lang3:3.16.0':'3.18.0'
            ]
            def request = details.requested
            def replacement = upgrades["${request.group}:${request.name}:${request.version}".toString()]
            if (replacement != null) {
                details.useVersion(replacement)
                details.because('Security remediation of resolved plugin classpath')
            }
        }
    }
}
plugins {
    id 'com.android.application' version '9.5.2' apply false
    id 'org.cyclonedx.bom' version '3.5.1'
}

// Export the resolved plugin graph, not requested versions or a guessed package list.
// The workflow invokes this task without configuration cache.
def pluginClasspath = buildscript.configurations.classpath
def graphFile = layout.buildDirectory.file('reports/security/plugin-classpath.json')
tasks.register('exportPluginClasspath') {
    outputs.file(graphFile)
    outputs.upToDateWhen { false }
    doLast {
        def graph = pluginClasspath.incoming.resolutionResult
        def moduleId = { id ->
            id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier ?
                [id.group, id.module, id.version] : null
        }
        def resolvedChildren = { component ->
            component.dependencies.collect { dep ->
                if (dep instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                    throw new GradleException("Unresolved plugin classpath dependency: " + dep.attempted)
                }
                moduleId(dep.selected.id)
            }.findAll { it != null }.unique()
        }
        def modules = graph.allComponents.findAll { moduleId(it.id) != null }.collect { component ->
            [coordinate: moduleId(component.id), dependencies: resolvedChildren(component)]
        }
        if (modules.isEmpty()) throw new GradleException('Empty plugin classpath graph')
        def target = graphFile.get().asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
            [schema: 1, roots: resolvedChildren(graph.root), components: modules]))
    }
}
