name: Android 16 navigation bar and inset QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'scripts/verify-edge-to-edge*.sh'
      - '.github/workflows/android-edge-to-edge-qa.yml'
  workflow_dispatch:

concurrency:
  # Cancel obsolete commits of the same PR, never cancel release QA jobs.
  group: brojko-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  android36-bars:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Prepare bundled font
        run: bash scripts/prepare-nunito.sh
      - name: Enable hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Test real API 36 gesture and 3-button navigation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            bash scripts/verify-edge-to-edge-emulator.sh
      - name: Upload Android 16 navigation test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brojko-android36-edge-to-edge
          if-no-files-found: warn
          path: edge-to-edge-*.txt
