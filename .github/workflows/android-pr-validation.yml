name: Android pull request validation
on:
  pull_request:
    branches: [main]

concurrency:
  # Cancel obsolete commits of the same PR, never cancel release QA jobs.
  group: brojko-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify pinned third-party GitHub Actions
        run: |
          python3 scripts/verify-action-pins.py
          python3 -m unittest discover -s tools -p 'test_action_pins.py' -v
      - name: Validate screenshot checker syntax
        run: python3 -m py_compile scripts/verify-emulator-screenshots.py
      - name: Validate pixel QA tool syntax and no-resize regression tests
        run: |
          python3 -m py_compile tools/visual_pixel_audit.py tools/test_visual_pixel_audit.py
          python3 -m venv /tmp/brojko-pixel-venv
          /tmp/brojko-pixel-venv/bin/python -m pip install --disable-pip-version-check 'Pillow>=11.3,<13'
          /tmp/brojko-pixel-venv/bin/python -m unittest discover -s tools -p 'test_visual_pixel_audit.py' -v
      - name: Verify Croatian Google Play README badge and destination
        run: python3 scripts/verify-google-play-readme.py
      - name: Verify 28 genuine Android gallery sources and README images
        run: python3 scripts/verify-marketing-gallery.py
      - name: Verify branded launcher vectors and Android mask-safe geometry
        run: python3 scripts/verify-brand-assets.py
      - name: Guard Android 15/16 edge-to-edge and deprecated APIs
        run: bash scripts/verify-edge-to-edge.sh
      - name: Security + dead-code audit (static source gate)
        run: python3 scripts/audit-production-code.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Prepare open-source font and license
        run: bash scripts/prepare-nunito.sh
      - name: Compile, lint and test PR without private signing credentials
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - name: Verify compiled package and Google Play SDK levels
        run: bash scripts/verify-play-sdk.sh app/build/outputs/apk/debug/*.apk
      # PR security checks must match the production runtime gate before
      # a reviewer can merge the branch. Build-tool findings stay visible.
      - name: Generate and validate runtime and complete-build CycloneDX SBOMs
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PbrojkoFullSbom=true cyclonedxBom
          test -s build/reports/cyclonedx/bom.json
          cp build/reports/cyclonedx/bom.json SBOM.build.cdx.json
          ./gradlew --no-daemon cyclonedxBom
          test -s build/reports/cyclonedx/bom.json
          cp build/reports/cyclonedx/bom.json SBOM.cdx.json
          python3 scripts/verify-sbom-scopes.py SBOM.cdx.json SBOM.build.cdx.json
      - name: Scan shipping Android dependencies for High and Critical CVEs
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          sbom: SBOM.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: grype-runtime.sarif
      - name: Report build-tool CVEs separately
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          sbom: SBOM.build.cdx.json
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          output-file: grype-build.sarif
      - name: Attach PR SBOMs and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brojko-pr-sca
          if-no-files-found: warn
          path: |
            SBOM.cdx.json
            SBOM.build.cdx.json
            grype-runtime.sarif
            grype-build.sarif
      - name: Generate release dependency inventory
        run: ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > dependency-inventory.txt
      - name: Attach Gradle dependency inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brojko-dependency-inventory
          path: dependency-inventory.txt
          if-no-files-found: error
      - name: Test release checksum generation on PR
        run: |
          bash scripts/generate-checksums.sh
          test "$(wc -l < SHA256SUMS)" -ge 3
