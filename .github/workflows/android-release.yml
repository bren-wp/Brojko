name: Build and release Android
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brojko-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify pinned third-party GitHub Actions
        run: python3 scripts/verify-action-pins.py
      - name: Guard Android 15/16 edge-to-edge and deprecated APIs
        run: bash scripts/verify-edge-to-edge.sh
      - name: Security + dead-code audit (static source gate)
        run: python3 scripts/audit-production-code.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Block known non-monotonic Google Play version codes
        env:
          RELEASE_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$RELEASE_NUMBER" -le 110 ]; then
            echo "::error::Release run number $RELEASE_NUMBER is not above known Play release 110. Verify the actual highest used versionCode before publishing."
            exit 1
          fi
      - name: Require configured production upload key
        env:
          STORE: ${{ secrets.BROJKO_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.BROJKO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BROJKO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BROJKO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$STORE" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::BROJKO upload signing secrets are required. Refusing unsigned stable release."
            exit 1
          fi
          printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/brojko-upload.jks"
          chmod 600 "$RUNNER_TEMP/brojko-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/brojko-upload.jks" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "BROJKO_KEYSTORE_FILE=$RUNNER_TEMP/brojko-upload.jks" >> "$GITHUB_ENV"
      - name: Prepare and verify Nunito font + OFL license
        run: bash scripts/prepare-nunito.sh
      - name: Run unit tests and build APK/AAB
        env:
          BROJKO_STORE_PASSWORD: ${{ secrets.BROJKO_STORE_PASSWORD }}
          BROJKO_KEY_ALIAS: ${{ secrets.BROJKO_KEY_ALIAS }}
          BROJKO_KEY_PASSWORD: ${{ secrets.BROJKO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - name: Verify signed release APK and signed Android App Bundle
        run: |
          set -euo pipefail
          SIGNER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools/36.0.0/apksigner"
          test -x "$SIGNER"
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          "$SIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          # jarsigner without -strict can exit 0 for an unsigned archive:
          # explicitly require its positive verification verdict.
          verdict="$(jarsigner -verify app/build/outputs/bundle/release/app-release.aab)"
          grep -Fq "jar verified." <<< "$verdict" || {
            echo "::error::Unsigned or unverifiable Android App Bundle"
            exit 1
          }
      # The SBOM is generated from resolved Gradle dependencies, not guessed
      # from the app manifest or source file list.
      - name: Generate complete build and shipped runtime CycloneDX SBOMs
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PbrojkoFullSbom=true cyclonedxBom
          test -s build/reports/cyclonedx/bom.json
          cp build/reports/cyclonedx/bom.json SBOM.build.cdx.json
          ./gradlew --no-daemon cyclonedxBom
          test -s build/reports/cyclonedx/bom.json
          cp build/reports/cyclonedx/bom.json SBOM.cdx.json
          python3 scripts/verify-sbom-scopes.py SBOM.cdx.json SBOM.build.cdx.json
      - name: Report build-tool vulnerabilities without hiding them
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          sbom: SBOM.build.cdx.json
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          output-file: grype-build.sarif
      # Critical and high findings in dependencies shipped in the Android app
      # MUST block publication. Build tooling is reported separately above.
      - name: Scan known vulnerabilities in release SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          sbom: SBOM.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: grype.sarif
      - name: Archive SBOM and CVE scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brojko-release-sca
          if-no-files-found: warn
          path: |
            SBOM.cdx.json
            SBOM.build.cdx.json
            grype.sarif
            grype-build.sarif
      - name: Validate compiled Google Play SDK and package policy
        run: |
          bash scripts/verify-play-sdk.sh app/build/outputs/apk/debug/*.apk
          bash scripts/verify-play-sdk.sh app/build/outputs/apk/release/*.apk
      # Gate publication on actual Android instrumentation and verified captures.
      - name: Enable hardware-accelerated Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify Android UI and capture real screens before release
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Catch vivid-corner geometry regressions before the full suite.
            adb shell am instrument -w -e class com.brendigo.brojko.ScreensSmokeTest#vividThemePreviewHasSourceCyanAndPurpleCorners com.brendigo.brojko.test/androidx.test.runner.AndroidJUnitRunner | tee vivid-preview-results.txt
            grep -Eq '^OK [(]1 test[)]$' vivid-preview-results.txt
            adb shell am instrument -w com.brendigo.brojko.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-results.txt
            grep -Eq '^OK [(][0-9]+ tests?[)]$' instrumentation-results.txt
            bash scripts/pull-verified-screenshots.sh
            python3 scripts/stage-marketing-screenshots.py
            test "$(find marketing-screenshots -maxdepth 1 -name 'brojko-*.png' | wc -l)" -eq 28
      - name: Attach Android instrumentation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brojko-release-emulator-proof
          path: |
            instrumentation-results.txt
            vivid-preview-results.txt
            android-screenshots/
          if-no-files-found: warn
      - name: Generate verified portable SHA256 checksums
        run: bash scripts/generate-checksums.sh --release-only
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Brojko-Android-v1.12-${{ github.run_number }}
          if-no-files-found: error
          path: |
            SHA256SUMS
            SBOM.cdx.json
            SBOM.build.cdx.json
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            marketing-screenshots/*.png
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.12.{0}', github.run_number) }}
          name: Brojko ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.12.{0}', github.run_number) }}
          generate_release_notes: true
          body: |
            BROJKO: tri načina igre, lokalni napredak, sigurnosna kopija i vizualne korekcije.
            Izdanje sadrži 28 stvarnih Android snimki nakon uspješnih Gradle, Lint, unit i emulator testova.
            **Signing:** release APK and AAB are signed with the configured upload key and must pass explicit signature validation before publication.
          files: |
            SHA256SUMS
            SBOM.cdx.json
            SBOM.build.cdx.json
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            marketing-screenshots/*.png
