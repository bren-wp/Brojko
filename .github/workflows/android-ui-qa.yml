name: Android UI smoke and screenshot QA
on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Build and release Android]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BROJKO_BUILD_NUMBER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_number || github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK and CLI paths
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare and verify Nunito font + OFL license
        run: bash scripts/prepare-nunito.sh
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run app on Android emulator and capture every screen
        id: emulator-primary
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # Fail QA if the screenshot build reports a different app version
            # from the release workflow that triggered this job.
            adb shell dumpsys package com.brendigo.brojko | grep -F "versionName=1.12.$BROJKO_BUILD_NUMBER"
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Preserve the failing test output and any generated screenshots
            # so a regression can be diagnosed directly from the PR artifact.
            adb shell am instrument -w com.brendigo.brojko.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-results.txt || true
            mkdir -p android-screenshots
            adb pull /sdcard/Android/data/com.brendigo.brojko/files/screenshots/ android-screenshots/ || echo "::warning::Some screenshots were not retrievable"
            grep -Eq "OK \\([1-9][0-9]* tests?\\)" instrumentation-results.txt
      - name: Retry emulator if the first boot failed before instrumenting
        id: emulator-retry
        if: ${{ steps.emulator-primary.outcome == 'failure' && hashFiles('instrumentation-results.txt') == '' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # Fail QA if the screenshot build reports a different app version
            # from the release workflow that triggered this job.
            adb shell dumpsys package com.brendigo.brojko | grep -F "versionName=1.12.$BROJKO_BUILD_NUMBER"
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Preserve the failing test output and any generated screenshots
            # so a regression can be diagnosed directly from the PR artifact.
            adb shell am instrument -w com.brendigo.brojko.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-results.txt || true
            mkdir -p android-screenshots
            adb pull /sdcard/Android/data/com.brendigo.brojko/files/screenshots/ android-screenshots/ || echo "::warning::Some screenshots were not retrievable"
            grep -Eq "OK \\([1-9][0-9]* tests?\\)" instrumentation-results.txt
      - name: Require a successful emulator test run
        if: always()
        run: |
          if [[ "${{ steps.emulator-primary.outcome }}" == "success" ||
                "${{ steps.emulator-retry.outcome }}" == "success" ]]; then
            exit 0
          fi
          echo "::error::Emulator instrumentation did not complete successfully. Do not merge."
          exit 1
      - name: Upload real Android screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Brojko-real-device-UI
          if-no-files-found: warn
          path: |
            android-screenshots/
            instrumentation-results.txt
