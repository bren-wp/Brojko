name: Android UI smoke and screenshot QA
on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Build and release Android]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Cancel obsolete commits of the same PR, never cancel release QA jobs.
  group: brojko-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  emulator:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BROJKO_BUILD_NUMBER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_number || github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK and CLI paths
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Prepare and verify Nunito font + OFL license
        run: bash scripts/prepare-nunito.sh
      - name: Prepare English screenshot verification
        run: |
          python3 -m venv /tmp/brojko-english-venv
          /tmp/brojko-english-venv/bin/python -m pip install --disable-pip-version-check 'Pillow>=11.3,<13'
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run app on Android emulator and capture every screen
        id: emulator-primary
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # Fail QA if the screenshot build reports a different app version
            # from the release workflow that triggered this job.
            adb shell dumpsys package com.brendigo.brojko | grep -F "versionName=1.12.$BROJKO_BUILD_NUMBER"
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Preserve the failing test output and any generated screenshots
            # so a regression can be diagnosed directly from the PR artifact.
            adb shell am instrument -w com.brendigo.brojko.test/com.brendigo.brojko.BrojkoTestRunner | tee instrumentation-results.txt
            grep -Eq '^OK [(][0-9]+ tests?[)]$' instrumentation-results.txt
            bash scripts/pull-verified-screenshots.sh
            python3 scripts/stage-marketing-screenshots.py
            adb shell am instrument -w -e class 'com.brendigo.brojko.LocaleMatrixTest#captureEveryLocalizedScreenAtRequestedViewports' -e captureLocales true -e fullViewports false -e localeOffset 0 -e localeCount 1 com.brendigo.brojko.test/com.brendigo.brojko.BrojkoTestRunner | tee english-capture-results.txt
            grep -Eq '^OK [(]1 test[s]?[)]$' english-capture-results.txt
            adb pull /sdcard/Android/data/com.brendigo.brojko/files/locale-screenshots/ ./english-native
            /tmp/brojko-english-venv/bin/python scripts/stage-localized-store-assets.py --captures english-native --output english-fastlane --locale-offset 0 --locale-count 1 --english-gallery
      - name: Retry emulator if the first boot failed before instrumenting
        id: emulator-retry
        if: ${{ steps.emulator-primary.outcome == 'failure' && hashFiles('instrumentation-results.txt') == '' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # Fail QA if the screenshot build reports a different app version
            # from the release workflow that triggered this job.
            adb shell dumpsys package com.brendigo.brojko | grep -F "versionName=1.12.$BROJKO_BUILD_NUMBER"
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Preserve the failing test output and any generated screenshots
            # so a regression can be diagnosed directly from the PR artifact.
            adb shell am instrument -w com.brendigo.brojko.test/com.brendigo.brojko.BrojkoTestRunner | tee instrumentation-results.txt
            grep -Eq '^OK [(][0-9]+ tests?[)]$' instrumentation-results.txt
            bash scripts/pull-verified-screenshots.sh
            python3 scripts/stage-marketing-screenshots.py
            adb shell am instrument -w -e class 'com.brendigo.brojko.LocaleMatrixTest#captureEveryLocalizedScreenAtRequestedViewports' -e captureLocales true -e fullViewports false -e localeOffset 0 -e localeCount 1 com.brendigo.brojko.test/com.brendigo.brojko.BrojkoTestRunner | tee english-capture-results.txt
            grep -Eq '^OK [(]1 test[s]?[)]$' english-capture-results.txt
            adb pull /sdcard/Android/data/com.brendigo.brojko/files/locale-screenshots/ ./english-native
            /tmp/brojko-english-venv/bin/python scripts/stage-localized-store-assets.py --captures english-native --output english-fastlane --locale-offset 0 --locale-count 1 --english-gallery
      - name: Require a successful emulator test run
        if: always()
        run: |
          if [[ "${{ steps.emulator-primary.outcome }}" == "success" ||
                "${{ steps.emulator-retry.outcome }}" == "success" ]]; then
            exit 0
          fi
          echo "::error::Emulator instrumentation did not complete successfully. Do not merge."
          exit 1
      - name: Upload real Android screen captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Brojko-real-device-UI
          if-no-files-found: warn
          path: |
            android-screenshots/
            instrumentation-results.txt
            english-capture-results.txt
            english-fastlane/english-gallery/
            english-fastlane/capture-manifest.json

  publish-marketing:
    name: Publish genuine Android gallery with the release
    needs: emulator
    # Never grant write access to untrusted PR builds. This job only
    # publishes captures from a successful main-branch release run.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # Allow a screenshot gallery for either a verified signed release
      # or an explicitly labeled unsigned preview with its test APK + AAB.
      # Never publish a gallery into an incomplete/nonexistent release.
      - name: Check published APK and AAB release before gallery upload
        id: verified_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.12.${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          if ! published="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No published $RELEASE_TAG release. Keeping UI screenshots as QA artifacts only."
            exit 0
          fi
          has_asset() { grep -Fxq "$1" <<< "$published"; }
          if ! has_asset SHA256SUMS || ! has_asset app-release.aab; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release $RELEASE_TAG is missing AAB or SHA256SUMS; gallery upload skipped."
            exit 0
          fi
          if has_asset app-release.apk; then
            echo "Signed APK/AAB release detected."
          elif has_asset app-debug.apk && has_asset app-release-unsigned.apk; then
            echo "Unsigned APK/AAB preview with installable debug-test APK detected."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release $RELEASE_TAG has no complete signed or unsigned APK set."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.verified_release.outputs.available == 'true'
        with:
          name: Brojko-real-device-UI
          path: .
      - name: Verify and stage unmodified emulator screenshots
        if: steps.verified_release.outputs.available == 'true'
        run: python3 scripts/stage-marketing-screenshots.py
      - name: Upload 28 reference and 23 English native screenshots to this exact release
        if: steps.verified_release.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.12.${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          screenshots=(marketing-screenshots/*.png)
          if (( ${#screenshots[@]} != 28 )); then
            echo "::error::Expected 28 real Android gallery files, found ${#screenshots[@]}"
            exit 1
          fi
          english=(english-fastlane/english-gallery/*.png)
          if (( ${#english[@]} != 23 )); then
            echo "::error::Expected 23 English native screenshots, found ${#english[@]}"
            exit 1
          fi
          screenshots+=("${english[@]}")
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          # GitHub upload endpoints occasionally return transient HTTP 500.
          # Retry each individual *real* image without masking persistent errors.
          for screenshot in "${screenshots[@]}"; do
            uploaded=false
            for attempt in 1 2 3 4; do
              if gh release upload "$RELEASE_TAG" "$screenshot" \
                  --repo "$GITHUB_REPOSITORY" --clobber; then
                uploaded=true
                break
              fi
              if (( attempt < 4 )); then
                echo "::warning::Retrying $(basename "$screenshot") (attempt $((attempt+1))/4)"
                sleep $((attempt * attempt * 3))
              fi
            done
            if [[ "$uploaded" != true ]]; then
              echo "::error::Cannot publish $(basename "$screenshot") after four attempts"
              exit 1
            fi
          done
          published="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for screenshot in "${screenshots[@]}"; do
            if ! grep -Fxq "$(basename "$screenshot")" <<< "$published"; then
              echo "::error::Missing release screenshot $(basename "$screenshot")"
              exit 1
            fi
          done

      # An image-only upload must not leave an unsigned preview classified
      # as a stable release. Do not touch the classification of signed builds.
      - name: Verify unsigned preview classification after gallery upload
        if: steps.verified_release.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.12.${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          names="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -Fxq 'app-release-unsigned.apk' <<< "$names" &&
             grep -Fxq 'app-debug.apk' <<< "$names"; then
            preview="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
            if [[ "$preview" != "true" ]]; then
              echo "::warning::Unsigned preview incorrectly marked stable; correcting metadata."
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease
            fi
            [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" == "true" ]] || {
              echo "::error::Unsigned gallery must belong to a prerelease"
              exit 1
            }
          fi

  compare-screenshots:
    name: Compare all 254 real emulator screenshot states
    needs: emulator
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download this PR's genuine Android emulator artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Brojko-real-device-UI
          path: candidate
      - name: Download verified main baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          # Immutable verified v1.12.251 main SHA 7f39f429...,
          # screenshot run 43769914306, artifact ID 14183598418.
          # Compare to the actual preceding release, not to older v1.12.250
          # or a moving latest-success reference.
          gh run download 43769914306 --repo "$GITHUB_REPOSITORY" \
            --name Brojko-real-device-UI --dir baseline
          test -d baseline/android-screenshots/screenshots
          test -d candidate/android-screenshots/screenshots
          (cd baseline && zip -qr ../brojko-main-254.zip android-screenshots)
          (cd candidate && zip -qr ../brojko-pr-254.zip android-screenshots)
      - name: Check native dimensions, missing frames and every RGB difference
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Pillow>=11.3,<13' 'numpy>=2.1,<3'
          python3 scripts/compare-emulator-galleries.py \
            --baseline brojko-main-254.zip --candidate brojko-pr-254.zip \
            --report brojko-254-regression.json
          python3 - <<'PY'
          import json
          with open("brojko-254-regression.json", encoding="utf-8") as f:
              report = json.load(f)
          assert report["screenshot_count_before"] == 254, "Wrong main baseline screenshot count"
          assert report["screenshot_count_after"] == 254, "Missing or unexpected PR screenshot count"
          assert len(report["screens"]) == 254, "Some same-name frames were not compared"
          assert not report["missing_from_candidate"], "PR lost real screenshot states"
          assert not any("error" in entry for entry in report["screens"]), "Screenshot dimension regression"
          print("Compared all 254 native screenshots; dynamic pixels require human review")
          PY
      - name: Archive exact per-screen regression report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brojko-254-real-screen-regression
          if-no-files-found: warn
          path: brojko-254-regression.json
