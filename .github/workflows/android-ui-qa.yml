name: Android UI smoke and screenshot QA
on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Build and release Android]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Cancel obsolete commits of the same PR, never cancel release QA jobs.
  group: brojko-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  emulator:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BROJKO_BUILD_NUMBER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_number || github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK and CLI paths
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Prepare and verify Nunito font + OFL license
        run: bash scripts/prepare-nunito.sh
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run app on Android emulator and capture every screen
        id: emulator-primary
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # Fail QA if the screenshot build reports a different app version
            # from the release workflow that triggered this job.
            adb shell dumpsys package com.brendigo.brojko | grep -F "versionName=1.12.$BROJKO_BUILD_NUMBER"
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Preserve the failing test output and any generated screenshots
            # so a regression can be diagnosed directly from the PR artifact.
            adb shell am instrument -w com.brendigo.brojko.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-results.txt
            grep -Eq '^OK [(][0-9]+ tests?[)]$' instrumentation-results.txt
            bash scripts/pull-verified-screenshots.sh
            python3 scripts/stage-marketing-screenshots.py
      - name: Retry emulator if the first boot failed before instrumenting
        id: emulator-retry
        if: ${{ steps.emulator-primary.outcome == 'failure' && hashFiles('instrumentation-results.txt') == '' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # Fail QA if the screenshot build reports a different app version
            # from the release workflow that triggered this job.
            adb shell dumpsys package com.brendigo.brojko | grep -F "versionName=1.12.$BROJKO_BUILD_NUMBER"
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Preserve the failing test output and any generated screenshots
            # so a regression can be diagnosed directly from the PR artifact.
            adb shell am instrument -w com.brendigo.brojko.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-results.txt
            grep -Eq '^OK [(][0-9]+ tests?[)]$' instrumentation-results.txt
            bash scripts/pull-verified-screenshots.sh
            python3 scripts/stage-marketing-screenshots.py
      - name: Require a successful emulator test run
        if: always()
        run: |
          if [[ "${{ steps.emulator-primary.outcome }}" == "success" ||
                "${{ steps.emulator-retry.outcome }}" == "success" ]]; then
            exit 0
          fi
          echo "::error::Emulator instrumentation did not complete successfully. Do not merge."
          exit 1
      - name: Upload real Android screen captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Brojko-real-device-UI
          if-no-files-found: warn
          path: |
            android-screenshots/
            instrumentation-results.txt

  publish-marketing:
    name: Publish genuine Android gallery with the release
    needs: emulator
    # Never grant write access to untrusted PR builds. This job only
    # publishes captures from a successful main-branch release run.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # A successful main-branch QA-only run is not a signed GitHub release.
      # Never fail screenshot QA because the owner has not provided the key,
      # nor create a bogus release with unverified artifacts.
      - name: Check verified signed release before publishing its gallery
        id: signed_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.12.${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          if ! published="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No published signed $RELEASE_TAG release. Keeping UI screenshots as QA artifacts only."
            echo "### Signed release not available" >> "$GITHUB_STEP_SUMMARY"
            echo "UI QA succeeded, but no signed $RELEASE_TAG was published. Gallery upload skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for filename in app-release.apk app-release.aab SHA256SUMS; do
            if ! grep -Fxq "$filename" <<< "$published"; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Release $RELEASE_TAG has no verified $filename. Skipping gallery upload."
              echo "### Incomplete signed release" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.signed_release.outputs.available == 'true'
        with:
          name: Brojko-real-device-UI
          path: .
      - name: Verify and stage unmodified emulator screenshots
        if: steps.signed_release.outputs.available == 'true'
        run: python3 scripts/stage-marketing-screenshots.py
      - name: Upload all 28 genuine screenshots to this exact release
        if: steps.signed_release.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.12.${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          screenshots=(marketing-screenshots/*.png)
          if (( ${#screenshots[@]} != 28 )); then
            echo "::error::Expected 28 real Android gallery files, found ${#screenshots[@]}"
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          # GitHub upload endpoints occasionally return transient HTTP 500.
          # Retry each individual *real* image without masking persistent errors.
          for screenshot in "${screenshots[@]}"; do
            uploaded=false
            for attempt in 1 2 3 4; do
              if gh release upload "$RELEASE_TAG" "$screenshot" \
                  --repo "$GITHUB_REPOSITORY" --clobber; then
                uploaded=true
                break
              fi
              if (( attempt < 4 )); then
                echo "::warning::Retrying $(basename "$screenshot") (attempt $((attempt+1))/4)"
                sleep $((attempt * attempt * 3))
              fi
            done
            if [[ "$uploaded" != true ]]; then
              echo "::error::Cannot publish $(basename "$screenshot") after four attempts"
              exit 1
            fi
          done
          published="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for screenshot in "${screenshots[@]}"; do
            if ! grep -Fxq "$(basename "$screenshot")" <<< "$published"; then
              echo "::error::Missing release screenshot $(basename "$screenshot")"
              exit 1
            fi
          done
