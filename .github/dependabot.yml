version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # AndroidX Core 1.19+ requires compileSdk >=37; Android SDK 36
    # remains the CI-compatible compile/target SDK for this project.
    # Remove this ignore only together with a tested SDK upgrade.
    ignore:
      - dependency-name: "androidx.core:core"
        versions: [">=1.19.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
