plugins { id 'com.android.application' }
android {
 namespace 'com.brendigo.brojko'
 compileSdk 36
 defaultConfig {
  applicationId 'com.brendigo.brojko'
  // Google Play automatic protection requires API 24 or higher.
  minSdk 24
  targetSdk 36
  testInstrumentationRunner 'com.brendigo.brojko.BrojkoTestRunner'
  // QA uses the release workflow's run number, not its own run number.
  def releaseBuildNumber = System.getenv('BROJKO_BUILD_NUMBER') ?: System.getenv('GITHUB_RUN_NUMBER')
  versionCode (releaseBuildNumber?.toInteger() ?: 2)
  versionName "1.12.${releaseBuildNumber ?: '0'}"
 }
 signingConfigs {
  release {
   if (System.getenv('BROJKO_KEYSTORE_FILE')) {
    storeFile file(System.getenv('BROJKO_KEYSTORE_FILE'))
    storePassword System.getenv('BROJKO_STORE_PASSWORD')
    keyAlias System.getenv('BROJKO_KEY_ALIAS')
    keyPassword System.getenv('BROJKO_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
   if (System.getenv('BROJKO_KEYSTORE_FILE')) signingConfig signingConfigs.release
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.returnDefaultValues=true }
}
dependencies {
 implementation 'androidx.core:core:1.18.0'
 implementation 'androidx.activity:activity:1.13.0'
 implementation 'androidx.customview:customview:1.2.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20260814'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 androidTestImplementation 'androidx.test:core:1.7.0'
 androidTestImplementation 'androidx.test:runner:1.7.0'
 androidTestImplementation 'androidx.test:rules:1.7.0'
}

/*
 * Two independently auditable dependency scopes:
 *  - default: shipped release runtime, used to block APK/AAB publication;
 *  - -PbrojkoFullSbom: all resolvable configurations, including build tools.
 * Never silence a build-time finding; emit the separate advisory SBOM instead.
 */
tasks.named('cyclonedxDirectBom') {
    includeConfigs = project.hasProperty('brojkoFullSbom') ? [] : ['releaseRuntimeClasspath']
}

// Scoped remediation candidates for the previously measured Android Lint
// dependency paths. Do not alter application runtime/test configurations or
// downgrade newer versions selected by the parent toolchain.
def lintSecurityUpgrades = [
 'org.bouncycastle:bcprov-jdk18on:1.80.2': '1.85',
 'org.bouncycastle:bcpkix-jdk18on:1.80.2': '1.85',
 'org.bouncycastle:bcutil-jdk18on:1.80.2': '1.85',
 'com.google.guava:guava:33.4.0-jre': '33.7.2-jre',
 'org.apache.httpcomponents:httpclient:4.5.6': '4.5.14',
 'org.apache.httpcomponents:httpmime:4.5.6': '4.5.14',
 'org.apache.commons:commons-lang3:3.16.0': '3.18.0'
]
configurations.configureEach { cfg ->
    if (cfg.name.toLowerCase(java.util.Locale.ROOT).contains('lint')) {
        cfg.resolutionStrategy.eachDependency { details ->
            def requested = details.requested
            def replacement = lintSecurityUpgrades["${requested.group}:${requested.name}:${requested.version}".toString()]
            if (replacement != null) {
                details.useVersion(replacement)
                details.because('Security remediation of measured Lint dependency; verify with full SBOM and SCA')
            }
        }
    }
}
