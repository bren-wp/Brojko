plugins { id 'com.android.application' }
android {
 namespace 'com.brendigo.brojko'
 compileSdk 37
 defaultConfig {
  applicationId 'com.brendigo.brojko'
  // Google Play automatic protection requires API 24 or higher.
  minSdk 24
  targetSdk 36
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  // QA uses the release workflow's run number, not its own run number.
  def releaseBuildNumber = System.getenv('BROJKO_BUILD_NUMBER') ?: System.getenv('GITHUB_RUN_NUMBER')
  versionCode (releaseBuildNumber?.toInteger() ?: 2)
  versionName "1.12.${releaseBuildNumber ?: '0'}"
 }
 signingConfigs {
  release {
   if (System.getenv('BROJKO_KEYSTORE_FILE')) {
    storeFile file(System.getenv('BROJKO_KEYSTORE_FILE'))
    storePassword System.getenv('BROJKO_STORE_PASSWORD')
    keyAlias System.getenv('BROJKO_KEY_ALIAS')
    keyPassword System.getenv('BROJKO_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
   if (System.getenv('BROJKO_KEYSTORE_FILE')) signingConfig signingConfigs.release
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.returnDefaultValues=true }
}
dependencies {
 implementation 'androidx.core:core:1.19.1'
 implementation 'androidx.activity:activity:1.13.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20260814'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 androidTestImplementation 'androidx.test:core:1.7.0'
 androidTestImplementation 'androidx.test:runner:1.7.0'
 androidTestImplementation 'androidx.test:rules:1.7.0'
}
