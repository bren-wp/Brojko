plugins { id 'com.android.application' }
android {
 namespace 'com.brendigo.brojko'
 compileSdk 36
 defaultConfig {
  applicationId 'com.brendigo.brojko'
  minSdk 23
  targetSdk 36
  versionCode (System.getenv('GITHUB_RUN_NUMBER')?.toInteger() ?: 2)
  versionName "1.2.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
 }
 signingConfigs {
  release {
   if (System.getenv('BROJKO_KEYSTORE_FILE')) {
    storeFile file(System.getenv('BROJKO_KEYSTORE_FILE'))
    storePassword System.getenv('BROJKO_STORE_PASSWORD')
    keyAlias System.getenv('BROJKO_KEY_ALIAS')
    keyPassword System.getenv('BROJKO_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   if (System.getenv('BROJKO_KEYSTORE_FILE')) signingConfig signingConfigs.release
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.returnDefaultValues=true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
